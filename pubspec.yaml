name: audity_player
description: Plays .audity files (narrated audio + word-synced transcript) on Windows and Android.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:

  flutter:
    sdk: flutter

  just_audio: ^0.9.40
  just_audio_windows: ^0.2.2

  archive: ^3.6.1

  path_provider: ^2.1.4
  path_provider_windows: ^2.3.0

  file_picker: ^8.1.2

  permission_handler: ^11.3.1

  shared_preferences: ^2.3.2

  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256